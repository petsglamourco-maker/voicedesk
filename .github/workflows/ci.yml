# Runs once the repo has a GitHub remote. Mirrors `pnpm verify` + e2e against the same
# Docker Compose infra used locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI-only throwaway values; real secrets never live in the repo.
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      PLATFORM_OWNER_PASSWORD: ci-only-owner-password
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Configure environment
        run: cp .env.example .env

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high

      - name: E2E
        run: |
          pnpm db:seed
          pnpm --filter @voicedesk/web exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
