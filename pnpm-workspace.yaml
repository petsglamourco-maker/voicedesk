packages:
  - apps/*
  - packages/*

# Release-age gate (security audit M17), stated explicitly so it can't silently change with a
# pnpm upgrade: no version newer than a day is installed. When choosing versions by hand we
# pick ones at least two weeks old. Never add minimumReleaseAgeExclude.
minimumReleaseAge: 1440

# Security fixes for transitive dependencies (pnpm audit, high): both come in through the voice
# worker's turn-detection plugin (onnxruntime-node -> adm-zip, @huggingface/transformers ->
# sharp). Remove once those packages depend on fixed versions themselves.
overrides:
  adm-zip: 0.6.1
  sharp: 0.35.5

# Only these dependencies may run install scripts.
allowBuilds:
  esbuild: true
  # Optional native accelerator (bullmq -> msgpackr); prebuilt binaries are used, no build needed.
  msgpackr-extract: false
  # Ship prebuilt platform binaries; install scripts are only source-build fallbacks.
  "@parcel/watcher": false
  "@swc/core": false
  # Windows/macOS/Linux CPU binaries are bundled; the script only fetches optional CUDA binaries.
  onnxruntime-node: false
  # Script only prints a version-scheme warning.
  protobufjs: false
  # No-op install script; platform binaries come as optional dependencies.
  "@livekit/local-inference": false
  # Prebuilt platform binaries (@img/sharp-*) are used; the script only checks/builds from source.
  sharp: false
